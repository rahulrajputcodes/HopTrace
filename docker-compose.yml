version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hoptrace-backend
    environment:
      - DATA_MODE=${DATA_MODE:-demo}
      - TOPOLOGY_PROVIDER=${TOPOLOGY_PROVIDER:-engine}
      - DEPENDENCY_ADAPTER=${DEPENDENCY_ADAPTER:-engine}
      - EXPLANATION_PROVIDER=${EXPLANATION_PROVIDER:-unavailable}
      - NOTIFICATION_PROVIDER=${NOTIFICATION_PROVIDER:-console}
      - SQLITE_DB_PATH=/app/data/hoptrace.db
      - SEED_DEMO_SUBSCRIBERS=${SEED_DEMO_SUBSCRIBERS:-true}
      - SEED_DEMO_INCIDENTS=${SEED_DEMO_INCIDENTS:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:8080,http://127.0.0.1}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - INGEST_API_KEY=${INGEST_API_KEY:-}
    volumes:
      - hoptrace_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).getcode() == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hoptrace-frontend
    ports:
      - "${PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hoptrace_data:
